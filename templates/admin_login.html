{% extends "base.html" %}

{% block title %}Вход в админку — Русский Лес{% endblock %}

{% block content %}

<section class="admin-page">
    <div class="container">
        <div class="admin-login-card">
            <p class="eyebrow">Админка</p>
            <h1>Вход</h1>
            <p>Введите пароль, чтобы изменить товары и цены.</p>

            {% if error %}
            <div class="admin-alert">{{ error }}</div>
            {% endif %}

            <form method="post" class="admin-form">
                <label>
                    Пароль
                    <input type="password" name="password" required autofocus>
                </label>

                <button type="submit" class="admin-button">Войти</button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
